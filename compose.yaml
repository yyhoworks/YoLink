name: yolink
services:
  yolink:
    # 发版时只需改这一处版本号来源：设置环境变量 YOLINK_VERSION，或修改下面的默认值；
    # 默认值须与 main.go 的 appVersion 保持一致。
    image: yolink:${YOLINK_VERSION:-0.14.0}
    container_name: yolink
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    ports:
      - "${STRMLINK_PORT:-8796}:8796"
    environment:
      TZ: Asia/Shanghai
      STRMLINK_ADMIN_PASSWORD: ${STRMLINK_ADMIN_PASSWORD:-}
    # 镜像默认以非特权用户 yolink（10001:10001）运行（见 Dockerfile 的 USER）；
    # 下面的宿主机目录必须对 10001:10001 可写，例如：sudo chown -R 10001:10001 ./data ./strm-test
    volumes:
      - type: bind
        source: ./data
        target: /data
      - type: bind
        source: ${STRMLINK_OUTPUT_DIR:-./strm-test}
        target: /strm
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
